<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapaMape</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#fafafa;}
header{
  position:sticky;top:0;background:white;padding:10px;text-align:center;
  font-weight:bold;border-bottom:1px solid #ddd;
}

/* PERFIL */
#perfil{
  position:fixed;top:60px;left:10px;background:white;
  padding:10px;border-radius:10px;z-index:1000;
}

/* MAPA */
#map{
  height:250px;
}

/* FEED */
#feed{max-width:500px;margin:auto;}

.post{
  background:white;margin:10px;border-radius:12px;
  overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.post img{width:100%;height:250px;object-fit:cover;}

.content{padding:10px;}

.actions{
  display:flex;justify-content:space-between;margin-top:10px;
}

.fab{
  position:fixed;bottom:20px;right:20px;
  background:#ff5722;color:white;border:none;
  padding:15px;border-radius:50%;font-size:20px;
}

/* FORM */
#formulario{
  position:fixed;bottom:0;width:100%;
  background:white;padding:15px;display:none;
}
</style>
</head>

<body>

<header>🔥 MapaMape</header>

<div id="map"></div>

<div id="feed"></div>

<button class="fab" onclick="abrirFormulario()">➕</button>

<!-- FORM -->
<div id="formulario">

<input id="titulo" placeholder="Título"><br><br>
<textarea id="descripcion" placeholder="Descripción"></textarea><br><br>
<input type="file" id="imagen"><br><br>

<label>
<input type="checkbox" id="anonimo">
Publicar anónimo
</label><br><br>

<button onclick="guardarProblema()">Publicar</button>
<button onclick="cerrarFormulario()">Cancelar</button>

</div>

<script>

// 🔥 CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROYECTO.firebaseapp.com",
  databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
  projectId: "TU_PROYECTO"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 📍 MAPA
let map = L.map('map').setView([-51.53, -72.30], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap'
}).addTo(map);

let marcadorSeleccionado;

map.on('click', function(e){
  if(marcadorSeleccionado){
    map.removeLayer(marcadorSeleccionado);
  }

  marcadorSeleccionado = L.marker(e.latlng).addTo(map);
});

// 📸 IMG
async function subirImagen(){
  const file = imagen.files[0];
  if(!file) return "";

  let form = new FormData();
  form.append("image", file);

  let res = await fetch("https://api.imgbb.com/1/upload?key=TU_API_IMGBB",{
    method:"POST", body:form
  });

  let data = await res.json();
  return data.data.url;
}

// 📝 PUBLICAR
async function guardarProblema(){

  if(!marcadorSeleccionado){
  // ubicación por defecto (Río Turbio aprox)
  marcadorSeleccionado = L.marker([-51.53, -72.30]).addTo(map);
}

  let foto = await subirImagen();

  db.ref("problemas").push({
    titulo: titulo.value,
    descripcion: descripcion.value,
    votos:0,
    foto:foto,
    anonimo: anonimo.checked,
    lat: marcadorSeleccionado.getLatLng().lat,
    lng: marcadorSeleccionado.getLatLng().lng,
    fecha:new Date().toISOString()
  });

  cerrarFormulario();
}

// 👍 VOTAR
function votar(id){
  db.ref("problemas/"+id+"/votos")
  .transaction(v => (v||0)+1);
}

// 💬 COMENTAR
function comentar(id,texto){
  if(!texto) return;

  db.ref("problemas/"+id+"/comentarios").push({
    texto:texto
  });
}

// 🧠 FEED + MAPA
db.ref("problemas").on("value", snap => {

  let feed = document.getElementById("feed");
  feed.innerHTML="";

  map.eachLayer(l=>{
    if(l instanceof L.Marker) map.removeLayer(l);
  });

  let lista=[];

  snap.forEach(c=>{
    let d=c.val();
    d.id=c.key;
    lista.push(d);
  });

  lista.sort((a,b)=> (b.votos||0)-(a.votos||0));

  lista.forEach(d=>{

    // MAPA
    let m = L.marker([d.lat, d.lng]).addTo(map);
    m.bindPopup(d.titulo);

    // FEED
    let div=document.createElement("div");
    div.className="post";

    div.innerHTML=`
      <img src="${d.foto || 'https://via.placeholder.com/400'}">

      <div class="content">
        <b>${d.anonimo ? "Anónimo" : "Usuario"}</b><br>
        ${d.titulo}<br>
        <small>${d.descripcion}</small>

        <div class="actions">
          <div>
            👍 ${d.votos||0}
            <button onclick="votar('${d.id}')">👍</button>
          </div>

          <button onclick="map.setView([${d.lat},${d.lng}],17)">
            📍 Ver
          </button>
        </div>

        <br>

        <input placeholder="Comentar..."
        onkeypress="if(event.key==='Enter') comentar('${d.id}', this.value)">
      </div>
    `;

    feed.appendChild(div);
  });

});

// UI
function abrirFormulario(){ formulario.style.display="block"; }
function cerrarFormulario(){ formulario.style.display="none"; }

</script>

</body>
</html>
